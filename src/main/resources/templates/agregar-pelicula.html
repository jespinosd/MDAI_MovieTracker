<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Película - MovieTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/peliculas}">
                <i class="bi bi-film"></i> MovieTracker
            </a>
            <div class="ms-auto">
                <a th:href="@{/peliculas}" class="btn btn-light btn-sm">
                    <i class="bi bi-arrow-left"></i> Cancelar
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Mensajes -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Agregar Nueva Película</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/peliculas/agregar}" th:object="${pelicula}" method="post">
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                                       placeholder="Ingrese el título de la película" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="anio" class="form-label">Año <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="anio" th:field="*{anio}"
                                           placeholder="2024" min="1800" max="2100" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="genero" class="form-label">Género <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="genero" th:field="*{genero}"
                                           placeholder="Ej: Acción, Drama, Comedia" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="director" class="form-label">Director <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="director" th:field="*{director}"
                                       placeholder="Nombre del director" required>
                            </div>

                            <div class="mb-3">
                                <label for="sinopsis" class="form-label">Sinopsis <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="sinopsis" th:field="*{sinopsis}"
                                          rows="5" placeholder="Descripción de la película" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="pathImagen" class="form-label">Ruta de la Imagen <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="pathImagen" th:field="*{pathImagen}"
                                       placeholder="/img/nombre-imagen.jpg" required>
                                <small class="text-muted">Ingrese la ruta de la imagen (ej: /img/pelicula.jpg)</small>
                            </div>

                            <hr>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Guardar Película
                                </button>
                                <a th:href="@{/peliculas}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
