<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Películas en OMDb - MovieTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:with="currentPage='omdb'" th:remove="tag">
        <div th:replace="~{fragments/navbar :: navbar-logueado}"></div>
    </div>

    <div class="container mt-4">
        <h2 class="mb-4">
            <i class="bi bi-cloud-arrow-down"></i> Buscar Películas Externas (OMDb)
        </h2>

        <!-- Mensajes -->
        <div th:if="${mensaje}" class="alert alert-info alert-dismissible fade show" role="alert">
            <i class="bi bi-info-circle"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Formulario de búsqueda -->
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-search"></i> Buscar en OMDb</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/omdb/buscar}" method="post">
                    <div class="row g-3">
                        <div class="col-md-10">
                            <input type="text" class="form-control" name="titulo"
                                   th:value="${terminoBusqueda}" placeholder="Título de la película..."
                                   required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Resultados de búsqueda -->
        <div th:if="${resultados != null and !resultados.isEmpty()}" class="card shadow">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                    <i class="bi bi-film"></i>
                    Resultados encontrados: <span th:text="${totalResultados}"></span>
                </h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div th:each="pelicula : ${resultados}" class="col-md-4 col-lg-3 mb-4">
                        <div class="card h-100 shadow-sm">
                            <!-- Imagen de la película -->
                            <img th:if="${pelicula.poster != null and pelicula.poster != 'N/A'}"
                                 th:src="${pelicula.poster}"
                                 class="card-img-top"
                                 th:alt="${pelicula.title}"
                                 style="height: 350px; object-fit: cover;">
                            <img th:if="${pelicula.poster == null or pelicula.poster == 'N/A'}"
                                 src="/img/default-movie.jpg"
                                 class="card-img-top"
                                 th:alt="${pelicula.title}"
                                 style="height: 350px; object-fit: cover;">

                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title" th:text="${pelicula.title}">Título</h6>
                                <p class="card-text text-muted mb-2">
                                    <small th:text="${pelicula.year}">Año</small>
                                </p>
                                <a th:href="@{/omdb/detalle/{id}(id=${pelicula.imdbId})}"
                                   class="btn btn-primary btn-sm mt-auto">
                                    <i class="bi bi-eye"></i> Ver Detalles
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Botón volver al catálogo -->
        <div class="mt-4 mb-4">
            <a th:href="@{/peliculas}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver al Catálogo Local
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
