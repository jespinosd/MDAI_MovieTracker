<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todas mis Películas - MovieTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:with="currentPage='coleccion'" th:remove="tag">
        <div th:replace="fragments/navbar :: navbar-logueado"></div>
    </div>

    <div class="container mt-4">
        <!-- Mensajes -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/coleccion}">Mi Colección</a></li>
                <li class="breadcrumb-item active" aria-current="page">Todas</li>
            </ol>
        </nav>

        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-film text-primary"></i> Todas mis Películas</h2>
            <div>
                <span class="badge bg-primary fs-6">
                    <span th:text="${#lists.size(peliculas)}"></span> película(s)
                </span>
            </div>
        </div>

        <!-- Lista vacía -->
        <div th:if="${#lists.isEmpty(peliculas)}" class="alert alert-info text-center">
            <i class="bi bi-info-circle fs-3"></i>
            <p class="mt-2 mb-0">Tu colección está vacía.</p>
            <a th:href="@{/peliculas}" class="btn btn-primary mt-3">
                <i class="bi bi-film"></i> Explorar catálogo
            </a>
        </div>

        <!-- Grid de películas -->
        <div th:if="${!#lists.isEmpty(peliculas)}" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col" th:each="pelicula : ${peliculas}">
                <div class="card shadow-sm h-100">
                    <!-- Imagen -->
                    <div th:if="${pelicula.pathImagen != null and !pelicula.pathImagen.isEmpty()}">
                        <img th:src="${pelicula.pathImagen}"
                             class="card-img-top"
                             style="height: 300px; object-fit: cover;"
                             th:alt="${pelicula.titulo}">
                    </div>
                    <div th:if="${pelicula.pathImagen == null or pelicula.pathImagen.isEmpty()}"
                         class="d-flex align-items-center justify-content-center bg-secondary text-white"
                         style="height: 300px;">
                        <div class="text-center">
                            <i class="bi bi-film" style="font-size: 4rem;"></i>
                            <p class="mt-2">Sin imagen</p>
                        </div>
                    </div>

                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title" th:text="${pelicula.titulo}"></h6>
                        <p class="text-muted small mb-2">
                            <i class="bi bi-calendar"></i> <span th:text="${pelicula.anio}"></span>
                        </p>

                        <div class="mt-auto">
                            <div class="d-grid gap-2">
                                <a th:href="@{/peliculas/{id}(id=${pelicula.idPelicula})}" class="btn btn-sm btn-blue">
                                    <i class="bi bi-eye"></i> Ver detalles
                                </a>

                                <form th:action="@{/coleccion/eliminar/{id}(id=${pelicula.idPelicula})}"
                                      method="post"
                                      onsubmit="return confirm('¿Eliminar esta película de tu colección?');">
                                    <input type="hidden" name="origen" value="todas">
                                    <button type="submit" class="btn btn-sm btn-danger w-100">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
