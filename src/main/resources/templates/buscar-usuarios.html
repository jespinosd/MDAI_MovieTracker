<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Usuarios - MovieTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/usuarios/perfil}">
                <i class="bi bi-film"></i> MovieTracker
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/usuarios/perfil}">
                            <i class="bi bi-person-circle"></i> Mi Perfil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/usuarios/buscar}">
                            <i class="bi bi-search"></i> Buscar Usuarios
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/usuarios/logout}">
                            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-search"></i> Buscar Usuarios</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/usuarios/buscar}" method="get">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <input type="text" class="form-control" name="query"
                                   th:value="${query}" placeholder="Buscar...">
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" name="tipo">
                                <option value="nombre" th:selected="${tipo == 'nombre' or tipo == null}">Por Nombre</option>
                                <option value="username" th:selected="${tipo == 'username'}">Por Username</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-people"></i> Resultados
                    <span class="badge bg-primary" th:text="${usuarios != null ? usuarios.size() : 0}">0</span>
                </h5>
                <a th:href="@{/usuarios/buscar}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-clockwise"></i> Ver Todos
                </a>
            </div>
            <div class="card-body">
                <div th:if="${usuarios == null or usuarios.isEmpty()}" class="text-center py-5 text-muted">
                    <i class="bi bi-inbox display-1"></i>
                    <p class="mt-3">No se encontraron usuarios</p>
                </div>

                <div th:if="${usuarios != null and !usuarios.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Nombre Completo</th>
                                <th>Email</th>
                                <th>Películas</th>
                                <th>Valoraciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td th:text="${u.idUsuario}">1</td>
                                <td>
                                    <i class="bi bi-person-circle text-primary"></i>
                                    <strong th:text="${u.username}">username</strong>
                                </td>
                                <td th:text="${u.nombre + ' ' + u.apellido1 + (u.apellido2 != null ? ' ' + u.apellido2 : '')}">Nombre</td>
                                <td th:text="${u.email}">email@example.com</td>
                                <td>
                                    <span class="badge bg-info"
                                          th:text="${u.coleccion != null ? u.coleccion.listaPeliculas.size() : 0}">0</span>
                                </td>
                                <td>
                                    <span class="badge bg-success"
                                          th:text="${u.listaValoraciones != null ? u.listaValoraciones.size() : 0}">0</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
