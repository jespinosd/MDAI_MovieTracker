<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTracker - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/peliculas}">
                <i class="bi bi-film"></i> MovieTracker
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Barra de búsqueda -->
                <form class="d-flex mx-auto" style="width: 50%;" th:action="@{/peliculas}" method="get">
                    <input class="form-control me-2" type="search" name="query" placeholder="Buscar películas..."
                           th:value="${query}" aria-label="Buscar">
                    <select class="form-select me-2" name="tipo" style="width: auto;">
                        <option value="titulo" th:selected="${tipo == 'titulo' or tipo == null}">Título</option>
                        <option value="director" th:selected="${tipo == 'director'}">Director</option>
                        <option value="genero" th:selected="${tipo == 'genero'}">Género</option>
                    </select>
                    <button class="btn btn-light" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>

                <ul class="navbar-nav ms-auto">
                    <!-- Mostrar cuando está logueado -->
                    <li class="nav-item" th:if="${logueado}">
                        <a class="nav-link" th:href="@{/usuarios/perfil}">
                            <i class="bi bi-person-circle"></i> <span th:text="${usuario.username}"></span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${logueado}">
                        <a class="nav-link" th:href="@{/usuarios/logout}">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </a>
                    </li>

                    <!-- Mostrar cuando NO está logueado -->
                    <li class="nav-item" th:if="${!logueado}">
                        <a class="nav-link" th:href="@{/usuarios/login}">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                        </a>
                    </li>
                    <li class="nav-item" th:if="${!logueado}">
                        <a class="nav-link" th:href="@{/usuarios/registro}">
                            <i class="bi bi-person-plus"></i> Registrarse
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Mensajes -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- Filtros laterales -->
            <div class="col-md-2">
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-funnel"></i> Filtros
                    </div>
                    <div class="card-body">
                        <form th:action="@{/peliculas}" method="get">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Género</label>
                                <select class="form-select form-select-sm" name="genero">
                                    <option value="todos">Todos</option>
                                    <option th:each="gen : ${generos}"
                                            th:value="${gen}"
                                            th:text="${gen}"
                                            th:selected="${gen == generoSeleccionado}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Año</label>
                                <select class="form-select form-select-sm" name="anio">
                                    <option value="">Todos</option>
                                    <option th:each="a : ${anios}"
                                            th:value="${a}"
                                            th:text="${a}"
                                            th:selected="${a == anioSeleccionado}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Valoración mínima</label>
                                <input type="number" class="form-control form-control-sm" name="valoracionMinima"
                                       th:value="${valoracionMinima}" placeholder="0-10"
                                       min="0" max="10" step="0.5">
                                <small class="text-muted">Películas con ≥ esta nota</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Ordenar</label>
                                <select class="form-select form-select-sm" name="ordenar">
                                    <option value="">Por defecto</option>
                                    <option value="titulo-asc" th:selected="${ordenar == 'titulo-asc'}">Título A-Z</option>
                                    <option value="titulo-desc" th:selected="${ordenar == 'titulo-desc'}">Título Z-A</option>
                                    <option value="anio-desc" th:selected="${ordenar == 'anio-desc'}">Año (nuevo)</option>
                                    <option value="anio-asc" th:selected="${ordenar == 'anio-asc'}">Año (antiguo)</option>
                                    <option value="valoracion" th:selected="${ordenar == 'valoracion'}">Valoración</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm w-100">Aplicar</button>
                            <a th:href="@{/peliculas}" class="btn btn-secondary btn-sm w-100 mt-2">Limpiar</a>
                        </form>

                        <hr>

                        <!-- Solo mostrar botón de agregar película si está logueado -->
                        <a th:if="${logueado}" th:href="@{/peliculas/agregar}" class="btn btn-success btn-sm w-100">
                            <i class="bi bi-plus-circle"></i> Agregar Película
                        </a>
                        <div th:if="${!logueado}" class="alert alert-info p-2 mb-0" style="font-size: 0.85rem;">
                            <i class="bi bi-info-circle"></i>
                            <a th:href="@{/usuarios/login}" class="alert-link">Inicia sesión</a> para gestionar películas
                        </div>
                    </div>
                </div>
            </div>

            <!-- Catálogo de películas -->
            <div class="col-md-10">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2><i class="bi bi-collection-play"></i> Catálogo de Películas</h2>
                    <span class="badge bg-primary" th:text="${peliculas.size()} + ' películas'"></span>
                </div>

                <!-- Mensaje si no hay películas -->
                <div th:if="${peliculas.isEmpty()}" class="alert alert-info">
                    <i class="bi bi-info-circle"></i> No se encontraron películas con los filtros seleccionados.
                </div>

                <!-- Grid de películas -->
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                    <div class="col" th:each="pelicula : ${peliculas}">
                        <div class="card h-100 shadow-sm">
                            <a th:href="@{/peliculas/{id}(id=${pelicula.idPelicula})}" class="text-decoration-none">
                                <div class="card-img-top bg-secondary d-flex align-items-center justify-content-center"
                                     style="height: 300px; position: relative;">
                                    <img th:if="${pelicula.pathImagen != null and !pelicula.pathImagen.isEmpty()}"
                                         th:src="${pelicula.pathImagen}"
                                         class="img-fluid"
                                         style="max-height: 100%; max-width: 100%; object-fit: cover;"
                                         th:alt="${pelicula.titulo}">
                                    <div th:if="${pelicula.pathImagen == null or pelicula.pathImagen.isEmpty()}"
                                         class="text-white text-center">
                                        <i class="bi bi-film" style="font-size: 4rem;"></i>
                                        <p class="mt-2">Sin imagen</p>
                                    </div>
                                </div>
                            </a>
                            <div class="card-body">
                                <h5 class="card-title text-truncate" th:text="${pelicula.titulo}" title="Ver detalles"></h5>
                                <p class="card-text">
                                    <small class="text-muted">
                                        <i class="bi bi-calendar"></i> <span th:text="${pelicula.anio}"></span><br>
                                        <i class="bi bi-person"></i> <span th:text="${pelicula.director}"></span><br>
                                        <i class="bi bi-tag"></i> <span th:text="${pelicula.genero}"></span>
                                    </small>
                                </p>
                            </div>
                            <div class="card-footer bg-transparent">
                                <div class="d-flex justify-content-between align-items-center">
                                    <a th:href="@{/peliculas/{id}(id=${pelicula.idPelicula})}"
                                       class="btn btn-sm btn-primary">
                                        <i class="bi bi-eye"></i> Ver
                                    </a>
                                    <!-- Solo mostrar botones de editar/eliminar si está logueado -->
                                    <div th:if="${logueado}">
                                        <a th:href="@{/peliculas/editar/{id}(id=${pelicula.idPelicula})}"
                                           class="btn btn-sm btn-outline-secondary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/peliculas/eliminar/{id}(id=${pelicula.idPelicula})}"
                                              method="post"
                                              style="display: inline;"
                                              onsubmit="return confirm('¿Estás seguro de eliminar esta película?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                    <!-- Botón para agregar a colección (futuro) -->
                                    <div th:if="${!logueado}">
                                        <button class="btn btn-sm btn-outline-secondary" disabled title="Inicia sesión para gestionar">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button class="btn btn-sm btn-outline-secondary" disabled title="Inicia sesión para gestionar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
