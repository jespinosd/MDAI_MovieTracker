spring.application.name=movieTracker

# Activar perfil local automáticamente (sobrescribe con tus credenciales locales)
spring.profiles.include=local

spring.datasource.url=jdbc:mysql://localhost:3308/springbootdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Configuracion API OMDb (valores por defecto - se sobrescriben con application-local.properties)
omdb.api.key=${OMDB_API_KEY:PLACEHOLDER_OMDB_KEY}
omdb.api.url=${OMDB_API_URL:http://www.omdbapi.com/}

# Configuracion OpenRouter para el chatbot de IA (valores por defecto - se sobrescriben con application-local.properties)
openrouter.api.key=${OPENROUTER_API_KEY:PLACEHOLDER_OPENROUTER_KEY}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:mistralai/devstral-2512:free}
